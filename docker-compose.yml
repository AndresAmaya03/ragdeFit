version: '3.8'

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: ragdefit
      POSTGRES_USER: ragdefit_user
      POSTGRES_PASSWORD: secretpassword
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file: ./backend/.env
    depends_on:
      - postgres
    volumes:
      - ./backend:/app
    ports:
      - "3000:3000"
    command: npm run dev

volumes:
  pgdata:

